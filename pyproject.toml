[build-system]
requires=["hatchling>=1.25"]
build-backend="hatchling.build"
[project]
name="usb-operator"
version="0.4.0"
description="Universal policy-governed physical-device operator"
readme="README.md"
requires-python=">=3.11"
license={text="Apache-2.0"}
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","pyserial>=3.5,<4"]
[project.optional-dependencies]
usb=["pyusb>=1.2.1"]
hid=["hidapi>=0.14"]
ble=["bleak>=0.22"]
vision=["opencv-python-headless>=4.10"]
industrial=["pymodbus>=3.7"]
ai=["httpx>=0.27"]
dev=["pytest>=8.3","pytest-asyncio>=0.24","httpx>=0.27","ruff>=0.6"]
[project.scripts]
usb-operator="usb_operator.cli:main"
[tool.hatch.build.targets.wheel]
packages=["src/usb_operator"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
asyncio_mode="auto"
